<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Bachaco Financiero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #07110f;
        --paper-raised: #0d1c19;
        --ledger-line: #25463b;
        --ink: #f2ead8;
        --ink-dim: #8ea59a;
        --gold: #f0c63d;
        --gold-dim: #8f7420;
        --income: #53c7b2;
        --expense: #d76b55;
        --savings: #6fcf78;
        --danger: #e45f63;
        --radius: 3px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background:
          repeating-linear-gradient(
            180deg,
            transparent,
            transparent 34px,
            rgba(255, 255, 255, 0.02) 35px
          ),
          var(--paper);
        color: var(--ink);
        font-family: "IBM Plex Sans", sans-serif;
        min-height: 100vh;
        padding: 0 16px 40px;
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
      }

      .gate-wrap {
        max-width: 420px;
        margin: 0 auto;
        padding: 70px 16px;
      }
      .gate-card {
        background: var(--paper-raised);
        border: 1px solid var(--ledger-line);
        border-radius: var(--radius);
        padding: 36px 28px;
        text-align: center;
      }
      .gate-card .mascot {
        margin: 0 auto 16px;
        width: 150px;
      }
      .gate-card h1 {
        font-family: "Zilla Slab", serif;
        font-size: 24px;
        margin: 0 0 8px;
      }
      .gate-card p {
        color: var(--ink-dim);
        font-size: 13.5px;
        margin: 0 0 20px;
      }
      .gate-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .gate-form input {
        text-align: center;
        font-size: 14px;
      }
      .gate-error {
        color: var(--danger);
        font-size: 12.5px;
        margin-top: 4px;
        display: none;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        padding: 26px 0 20px;
        border-bottom: 2px solid var(--ledger-line);
        flex-wrap: wrap;
      }
      .title-row {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      .mascot {
        flex-shrink: 0;
        width: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mascot img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 50%;
      }
      .title-block .eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--gold-dim);
        margin: 0 0 6px;
      }
      .title-block h1 {
        font-family: "Zilla Slab", serif;
        font-weight: 700;
        font-size: 30px;
        margin: 0;
        color: var(--ink);
      }
      .title-block p {
        margin: 6px 0 0;
        color: var(--ink-dim);
        font-size: 13.5px;
      }
      .stamp {
        width: 100px;
        height: 100px;
        border: 2.5px solid var(--gold);
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: rotate(-8deg);
        flex-shrink: 0;
        position: relative;
        color: var(--gold);
        font-family: "IBM Plex Mono", monospace;
      }
      .stamp::before {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1px dashed var(--gold-dim);
        border-radius: 50%;
      }
      .stamp .pct {
        font-size: 22px;
        font-weight: 600;
        line-height: 1;
      }
      .stamp .lbl {
        font-size: 8px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-top: 4px;
        text-align: center;
      }

      .nav-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 0;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--ledger-line);
        flex-wrap: wrap;
      }
      nav.tabs {
        display: flex;
        gap: 2px;
        flex-wrap: wrap;
      }
      nav.tabs button {
        background: none;
        border: none;
        color: var(--ink-dim);
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 13px;
        padding: 9px 13px;
        cursor: pointer;
        border-radius: var(--radius) var(--radius) 0 0;
        display: flex;
        align-items: center;
        gap: 6px;
        border-bottom: 2px solid transparent;
      }
      nav.tabs button:hover {
        color: var(--ink);
      }
      nav.tabs button.active {
        color: var(--gold);
        border-bottom: 2px solid var(--gold);
        background: var(--paper-raised);
      }
      #logout-btn {
        font-size: 12.5px;
        white-space: nowrap;
        color: var(--ink-dim);
      }
      #logout-btn:hover {
        color: var(--danger);
        border-color: var(--danger);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1px;
        background: var(--ledger-line);
        border: 1px solid var(--ledger-line);
        margin-bottom: 28px;
        border-radius: var(--radius);
        overflow: hidden;
      }
      .stat {
        background: var(--paper-raised);
        padding: 16px 14px;
      }
      .stat .lbl {
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-dim);
        margin: 0 0 8px;
      }
      .stat .val {
        font-family: "Zilla Slab", serif;
        font-size: 23px;
        font-weight: 600;
        margin: 0;
      }
      .stat.income .val {
        color: var(--income);
      }
      .stat.expense .val {
        color: var(--expense);
      }
      .stat.savings .val {
        color: var(--savings);
      }
      .stat.current .val {
        color: var(--gold);
      }
      .stat.current.negative .val,
      .stat.savings.negative .val,
      .stat.net-real.negative .val {
        color: var(--expense);
      }
      .stat.rate .val {
        color: var(--gold);
      }
      @media (max-width: 900px) {
        .stats {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 640px) {
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .month-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12.5px;
        color: var(--ink-dim);
      }
      .month-row select {
        background: var(--paper-raised);
        color: var(--ink);
        border: 1px solid var(--ledger-line);
        border-radius: var(--radius);
        padding: 6px 10px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12.5px;
      }
      .month-row .month-help {
        font-size: 11px;
        color: var(--gold-dim);
        margin-left: auto;
      }
      .user-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px dotted var(--ledger-line);
      }
      .user-row:last-child {
        border-bottom: none;
      }
      .user-row .mv-cat {
        min-width: 0;
      }
      .user-menu-wrap {
        position: relative;
        margin-left: auto;
      }
      .user-menu-btn {
        background: none;
        border: none;
        color: var(--ink-dim);
        font-size: 21px;
        line-height: 1;
        padding: 2px 8px;
        cursor: pointer;
        border-radius: var(--radius);
        letter-spacing: 2px;
      }
      .user-menu-btn:hover {
        color: var(--gold);
        background: var(--paper);
      }
      .user-menu {
        position: absolute;
        right: 0;
        top: 34px;
        z-index: 20;
        min-width: 180px;
        background: var(--paper-raised);
        border: 1px solid var(--ledger-line);
        border-radius: var(--radius);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        padding: 5px;
        display: none;
      }
      .user-menu.open {
        display: block;
      }
      .user-menu button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--ink);
        padding: 9px 10px;
        border-radius: var(--radius);
        cursor: pointer;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 13px;
      }
      .user-menu button:hover {
        background: var(--paper);
        color: var(--gold);
      }
      .password-dialog {
        max-width: 420px;
      }

      .private-section {
        padding: 6px 0;
      }
      .private-divider {
        height: 1px;
        background: var(--ledger-line);
        margin: 22px 0;
      }
      .private-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      .private-heading > strong {
        font-family: "Zilla Slab", serif;
        font-size: 22px;
        color: var(--expense);
      }
      .card-overview {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        background: var(--ledger-line);
        border: 1px solid var(--ledger-line);
        margin: 14px 0 18px;
        border-radius: var(--radius);
        overflow: hidden;
      }
      .card-stat {
        background: var(--paper);
        padding: 14px;
      }
      .card-stat-label {
        display: block;
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-dim);
        margin-bottom: 7px;
      }
      .card-stat strong {
        font-family: "Zilla Slab", serif;
        font-size: 20px;
      }
      .card-progress-wrap {
        margin: 8px 0 18px;
      }
      .card-progress-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        color: var(--ink-dim);
        margin-bottom: 7px;
      }
      .card-progress-status {
        font-weight: 600;
      }
      .card-progress {
        height: 10px;
        background: var(--paper);
        border: 1px solid var(--ledger-line);
        border-radius: 10px;
        overflow: hidden;
      }
      .card-progress-fill {
        height: 100%;
        background: var(--savings);
        border-radius: 10px;
        transition: width 0.2s;
      }
      .card-progress-fill.warn {
        background: var(--gold);
      }
      .card-progress-fill.bad {
        background: var(--danger);
      }
      .card-limit-status.ok {
        color: var(--savings);
      }
      .card-limit-status.warn {
        color: var(--gold);
      }
      .card-limit-status.bad,
      .card-progress-note.danger {
        color: var(--danger);
      }
      .card-limit-unlimited {
        color: var(--ink-dim);
      }
      .card-progress-note {
        font-size: 12px;
        color: var(--ink-dim);
        margin: 7px 0 0;
      }
      .card-progress-note[data-action] {
        cursor: pointer;
      }
      .card-progress-note[data-action]:hover {
        color: var(--gold);
      }
      .card-actions {
        display: flex;
        gap: 8px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .action-grid {
        margin-top: 14px;
      }
      .future-now-option {
        align-items: flex-start;
        padding: 7px 0;
      }
      .future-now-option span {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .future-now-option small {
        color: var(--ink-dim);
        font-size: 11px;
        font-weight: 400;
      }
      .card-movement-form {
        padding: 14px;
        background: var(--paper);
        border: 1px solid var(--ledger-line);
        border-radius: var(--radius);
        margin-bottom: 14px;
      }
      .check-option {
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 38px;
        color: var(--ink);
        font-size: 13px;
        cursor: pointer;
      }
      .check-option input {
        width: auto;
        margin: 0;
        accent-color: var(--gold);
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.68);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        z-index: 100;
      }
      .modal-backdrop[hidden] {
        display: none;
      }
      .modal-card {
        position: relative;
        width: min(420px, 100%);
        background: var(--paper-raised);
        border: 1px solid var(--ledger-line);
        border-radius: 6px;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .modal-card h3 {
        font-family: "Zilla Slab", serif;
        font-size: 21px;
        margin: 0 28px 6px 0;
      }
      .modal-card label {
        display: block;
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--ink-dim);
        margin: 16px 0 6px;
      }
      .modal-card input {
        width: 100%;
        font-size: 15px;
      }
      .modal-close {
        position: absolute;
        right: 10px;
        top: 10px;
        background: none;
        border: none;
        color: var(--ink-dim);
        font-size: 17px;
        cursor: pointer;
        padding: 5px;
      }
      .modal-close:hover {
        color: var(--danger);
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }
      @media (max-width: 700px) {
        .card-overview {
          grid-template-columns: 1fr;
        }
        .card-stat {
          padding: 11px 14px;
        }
      }
      section.panel {
        background: var(--paper-raised);
        border: 1px solid var(--ledger-line);
        border-radius: var(--radius);
        margin-bottom: 24px;
        padding: 22px 22px 24px;
      }
      section.panel > h2 {
        font-family: "Zilla Slab", serif;
        font-size: 19px;
        font-weight: 600;
        margin: 0 0 4px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      section.panel > .sub {
        margin: 0 0 18px;
        color: var(--ink-dim);
        font-size: 13px;
      }

      .hormiga-panel {
        border-color: var(--gold-dim);
      }
      .hormiga-top {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .hormiga-ant {
        font-size: 34px;
      }
      .hormiga-amt {
        font-family: "Zilla Slab", serif;
        font-size: 34px;
        font-weight: 700;
      }
      .hormiga-amt.ok {
        color: var(--savings);
      }
      .hormiga-amt.bad {
        color: var(--danger);
      }
      .hormiga-msg {
        padding: 12px 14px;
        border-radius: var(--radius);
        font-size: 13.5px;
        border-left: 3px solid var(--savings);
        background: var(--paper);
        color: var(--ink);
      }
      .hormiga-msg.bad {
        border-left-color: var(--danger);
        color: #e2a99f;
      }
      .hormiga-sub {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11.5px;
        color: var(--ink-dim);
      }

      .two-col {
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 28px;
      }
      @media (max-width: 760px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }

      .donut-wrap {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .legend {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 12.5px;
        flex: 1;
        min-width: 160px;
      }
      .legend li {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 7px;
        color: var(--ink-dim);
      }
      .legend .sw {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex-shrink: 0;
      }
      .legend .amt {
        margin-left: auto;
        font-family: "IBM Plex Mono", monospace;
        color: var(--ink);
      }
      .empty-note {
        color: var(--ink-dim);
        font-size: 13px;
        font-style: italic;
      }

      .bars {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 150px;
        padding-top: 10px;
      }
      .bar-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        height: 100%;
      }
      .bar-col .m-lbl {
        margin-top: 8px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        color: var(--ink-dim);
      }

      .fixed-list,
      .goal-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .fixed-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px dotted var(--ledger-line);
      }
      .fixed-item:last-child {
        border-bottom: none;
      }
      .icon-select {
        background: var(--paper);
        border: 1px solid var(--ledger-line);
        color: var(--ink);
        border-radius: var(--radius);
        font-size: 15px;
        padding: 5px 4px;
        width: 56px;
      }
      .fixed-item .fname {
        flex: 1;
        font-size: 14.5px;
      }
      .fixed-item .fname.off {
        color: var(--ink-dim);
        text-decoration: line-through;
      }
      .fixed-item input.famt {
        width: 90px;
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--ledger-line);
        color: var(--ink);
        font-family: "IBM Plex Mono", monospace;
        font-size: 13.5px;
        padding: 4px 2px;
        text-align: right;
      }
      .fixed-item input.famt:focus {
        outline: none;
        border-bottom-color: var(--gold);
      }
      .toggle {
        position: relative;
        width: 38px;
        height: 20px;
        flex-shrink: 0;
        border-radius: 20px;
        background: var(--ledger-line);
        cursor: pointer;
        transition: background 0.15s;
      }
      .toggle.on {
        background: var(--savings);
      }
      .toggle .knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--ink);
        transition: left 0.15s;
      }
      .toggle.on .knob {
        left: 20px;
      }
      .del-btn {
        background: none;
        border: none;
        color: var(--ink-dim);
        cursor: pointer;
        font-size: 15px;
        padding: 2px 6px;
        line-height: 1;
      }
      .del-btn:hover {
        color: var(--danger);
      }
      .add-fixed-row {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .add-fixed-row input {
        flex: 1;
        min-width: 120px;
      }

      input,
      select {
        background: var(--paper);
        border: 1px solid var(--ledger-line);
        color: var(--ink);
        border-radius: var(--radius);
        padding: 9px 10px;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 13.5px;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--gold-dim);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 56px 1fr 1fr 1fr 1fr 1fr auto;
        gap: 10px;
        align-items: end;
      }
      .form-grid > div {
        min-width: 0;
      }
      .form-grid input {
        width: 100%;
        min-width: 0;
      }
      .form-submit {
        grid-column: 1 / -1;
      }
      .form-submit .btn-primary {
        width: 25%;
      }
      @media (max-width: 760px) {
        .form-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      .form-grid label {
        display: block;
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-dim);
        margin-bottom: 5px;
      }
      .type-toggle {
        display: flex;
        border: 1px solid var(--ledger-line);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .type-toggle button {
        flex: 1;
        background: var(--paper);
        border: none;
        color: var(--ink-dim);
        padding: 9px 6px;
        font-size: 12.5px;
        cursor: pointer;
        font-family: "IBM Plex Sans", sans-serif;
      }
      .type-toggle button.active.income {
        background: var(--income);
        color: #0d1a17;
      }
      .type-toggle button.active.expense {
        background: var(--expense);
        color: #0d1a17;
      }
      .btn-primary {
        background: var(--gold);
        color: #1c2b1f;
        border: none;
        border-radius: var(--radius);
        padding: 9px 16px;
        font-weight: 600;
        font-size: 13.5px;
        cursor: pointer;
        font-family: "IBM Plex Sans", sans-serif;
      }
      .btn-primary:hover {
        background: #dcb536;
      }
      .btn-ghost {

      function iconOptions(selected) {

      function guessIcon(text) {
        const t = (text || "").toLowerCase();
        const map = [
          [["arriendo", "alquiler", "renta"], "🏠"],

      }

      let state = {
        transactions: [],
        fixed: [
          { id: "f1", name: "Arriendo", amount: 0, active: true, icon: "🏠" },
          { id: "f2", name: "Mercado", amount: 0, active: true, icon: "🛒" },
          { id: "f3", name: "Transporte", amount: 0, active: true, icon: "🚌" },
        ],
        goals: [
          {
            id: "g1",
            name: "Clases Autoescuela",
            icon: "🎓",
            target: 0,
            pct: 0,
          },
          {
            id: "g2",
            name: "PC Gamer",
            icon: "💻",
            target: 0,
            pct: 0,
          },
          {
            id: "g3",
            name: "Entrada Primer Coche",
            icon: "🚗",
            target: 0,
            pct: 0,
          },
        ],
        fixedSnapshots: {},
        futureExpenses: [],
        loaded: false,
      };
      let privateData = { pareja: [], tarjeta: [] };
      let appUnlocked = false;
      let currentUser = null;

      function todayStr() {
        const d = new Date();
        const y = d.getFullYear(),
          m = String(d.getMonth() + 1).padStart(2, "0"),
          day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      function realMonth() {
        return todayStr().slice(0, 7);
      }
      let currentMonth = realMonth();
      let activeView = "resumen";
      let txType = "ingreso";
      let txIcon = "💵";
      let recoRate = 20;

      function uid() {
        return Math.random().toString(36).slice(2, 10);
      }
      function money(n) {
        const v = Math.round((n + Number.EPSILON) * 100) / 100;
        return (
          (v < 0 ? "-" : "") +
          Math.abs(v).toLocaleString("es-ES", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          }) +
          " €"
        );
      }
      function todayFormatted() {
        const d = new Date();
        const dd = String(d.getDate()).padStart(2, "0");
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const yy = String(d.getFullYear()).slice(-2);
        return `${dd}/${mm}/${yy}`;
      }

      async function api(path, options = {}) {
        const opts = {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
        };
        const r = await fetch(path, opts);
        let data = {};
        try {
          data = await r.json();
        } catch (e) {}
        if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
        return data;
      }
      function normalizePrivateData() {
        if (!privateData || typeof privateData !== "object") privateData = {};
        if (!Array.isArray(privateData.pareja)) privateData.pareja = [];
        if (!Array.isArray(privateData.tarjeta)) privateData.tarjeta = [];
        if (
          !privateData.tarjetaMeta ||
          typeof privateData.tarjetaMeta !== "object"
        )
          privateData.tarjetaMeta = {};
        privateData.tarjetaMeta.creditUsed = Math.max(
          0,
          Number(privateData.tarjetaMeta.creditUsed) || 0,
        );
        privateData.tarjetaMeta.limit = Math.max(
          0,
          Number(privateData.tarjetaMeta.limit) || 0,
        );

        // Compatibilidad con la versión anterior: todos los movimientos de tarjeta
        // que no tenían tipo se consideran cargos.
        privateData.tarjeta = privateData.tarjeta
          .map((t) => ({
            ...t,
            type: t.type === "pago" ? "pago" : "cargo",
            amount: Math.max(0, Number(t.amount) || 0),
          }))
          .filter((t) => t.amount > 0);

        privateData.pareja = privateData.pareja
          .map((t) => ({
            ...t,
            amount: Math.max(0, Number(t.amount) || 0),
          }))
          .filter((t) => t.amount > 0);
      }
      function tarjetaChargesForMonth(month) {
        normalizePrivateData();
        return privateData.tarjeta
          .filter(
            (t) =>
              (t.date || "").slice(0, 7) === month &&
              (t.type || "cargo") === "cargo",
          )
          .reduce((s, t) => s + (Number(t.amount) || 0), 0);
      }
      function tarjetaPaymentsForMonth(month) {
        normalizePrivateData();
        return privateData.tarjeta
          .filter(
            (t) => (t.date || "").slice(0, 7) === month && t.type === "pago",
          )
          .reduce((s, t) => s + (Number(t.amount) || 0), 0);
      }
      function tarjetaBalance() {
        normalizePrivateData();
        const charges = privateData.tarjeta
          .filter((t) => t.type === "cargo")
          .reduce((s, t) => s + (Number(t.amount) || 0), 0);
        const payments = privateData.tarjeta
          .filter((t) => t.type === "pago")
          .reduce((s, t) => s + (Number(t.amount) || 0), 0);
        return Math.max(
          0,
          (Number(privateData.tarjetaMeta.creditUsed) || 0) +
            charges -
            payments,
        );
      }
      function tarjetaLimitInfo() {
        normalizePrivateData();
        const limit = Number(privateData.tarjetaMeta.limit) || 0;
        const used = tarjetaBalance();
        if (limit <= 0)
          return { limit: 0, used, pct: 0, over: 0, noLimit: true };
        return {
          limit,
          used,
          pct: (used / limit) * 100,
          over: Math.max(0, used - limit),
          noLimit: false,
        };
      }
      function snapshotForServer() {
        return {
          transactions: state.transactions,
          fixed: state.fixed,
          goals: state.goals,
          fixedSnapshots: state.fixedSnapshots,
          futureExpenses: state.futureExpenses,
          privateData,
        };
      }
      async function loadState() {
        appUnlocked = true;
        try {
          const me = await api("/api/me");
          currentUser = me.user;
          const payload = await api("/api/state");
          state.transactions = payload.transactions || [];
          state.fixed = payload.fixed || state.fixed;
          state.goals = payload.goals || state.goals;
          state.fixedSnapshots = payload.fixedSnapshots || {};
          state.futureExpenses = payload.futureExpenses || [];
          privateData = payload.privateData || { pareja: [], tarjeta: [] };
          state.loaded = true;
          // El mes financiero es independiente de la fecha de pago.
          // Solo se permite navegar a meses que ya existan o que hayan sido
          // generados por la regla de 5 días antes del cierre.
          const savedMonth = sessionStorage.getItem("bachaco-month");
          currentMonth =
            savedMonth && isMonthSelectable(savedMonth)
              ? savedMonth
              : defaultFinancialMonth();
          ensureGeneratedNextMonth();
          applyFixedSnapshot(currentMonth);
          render();
        } catch (e) {
          currentUser = null;
          state.loaded = false;
          renderGate();
        }
      }
      async function saveAll() {
        try {
          await api("/api/state", {
            method: "PUT",
            body: JSON.stringify(snapshotForServer()),
          });
        } catch (e) {
          console.error(e);
          alert(
            "No se pudo guardar el cambio. Comprueba que el servidor siga funcionando.",
          );
        }
      }
      async function saveTransactions() {
        await saveAll();
      }
      async function saveGoals() {
        await saveAll();
      }
      async function savePrivate() {
        await saveAll();
      }
      async function saveFuture() {
        await saveAll();
      }
      async function saveFixed() {
        state.fixedSnapshots[currentMonth] = {
          total: activeFixedTotal(),
          items: JSON.parse(JSON.stringify(state.fixed)),
        };
        await saveAll();
      }
      function nextMonth(month) {
        const [y, m] = month.split("-").map(Number);
        const d = new Date(y, m, 1);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
      }
      function previousMonth(month) {
        const [y, m] = month.split("-").map(Number);
        const d = new Date(y, m - 2, 1);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
      }
      function lastDayOfMonth(month) {
        const [y, m] = month.split("-").map(Number);
        return new Date(y, m, 0).getDate();
      }
      function nextMonthIsGenerated() {
        const now = new Date();
        const lastDay = new Date(
          now.getFullYear(),
          now.getMonth() + 1,
          0,
        ).getDate();
        return now.getDate() >= lastDay - 5;
      }
      function generatedNextMonth() {
        return nextMonth(realMonth());
      }
      function isMonthSelectable(month) {
        if (!/^\d{4}-\d{2}$/.test(month)) return false;
        const real = realMonth();
        if (month <= real) return true;
        return month === generatedNextMonth() && nextMonthIsGenerated();
      }
      function defaultFinancialMonth() {
        return nextMonthIsGenerated() ? generatedNextMonth() : realMonth();
      }
      function ensureGeneratedNextMonth() {
        if (!nextMonthIsGenerated()) return;
        const month = generatedNextMonth();
        if (state.fixedSnapshots?.[month] !== undefined) return;
        const prev = previousMonth(month);
        let items = null;
        const prevSnap = state.fixedSnapshots?.[prev];
        if (
          prevSnap &&
          typeof prevSnap === "object" &&
          Array.isArray(prevSnap.items)
        )
          items = prevSnap.items;
        else if (Array.isArray(state.fixed)) items = state.fixed;
        if (!items) return;
        state.fixedSnapshots[month] = {
          total: items
            .filter((f) => f.active)
            .reduce((sum, f) => sum + (Number(f.amount) || 0), 0),
          items: JSON.parse(JSON.stringify(items)),
        };
        saveAll();
      }
      function applyFixedSnapshot(month) {
        const snap = state.fixedSnapshots?.[month];
        if (snap && typeof snap === "object" && Array.isArray(snap.items)) {
          state.fixed = JSON.parse(JSON.stringify(snap.items));
        }
      }
      function fixedSnapshotItems(month) {
        const snap = state.fixedSnapshots?.[month];
        return snap && typeof snap === "object" && Array.isArray(snap.items)
          ? snap.items
          : null;
      }

      function monthTx(month) {
        return state.transactions.filter(
          (t) => (t.budgetMonth || t.date.slice(0, 7)) === month,
        );
      }
      function activeFixedTotal() {
        return state.fixed
          .filter((f) => f.active)
          .reduce((s, f) => s + (Number(f.amount) || 0), 0);
      }
      function fixedTotalForMonth(month) {
        const snap = state.fixedSnapshots?.[month];
        if (snap !== undefined)
          return typeof snap === "object"
            ? Number(snap.total) || 0
            : Number(snap) || 0;
        return month === currentMonth ? activeFixedTotal() : 0;
      }
      function privateTotalForMonth(month, key) {
        normalizePrivateData();
        if (key === "tarjeta") return tarjetaPaymentsForMonth(month);
        return privateData[key]
          .filter((t) => (t.date || "").slice(0, 7) === month)
          .reduce((s, t) => s + (Number(t.amount) || 0), 0);
      }
      function futureRealizedForMonth(month) {
        const t = todayStr();
        return state.futureExpenses.filter(
          (f) => f.date.slice(0, 7) === month && f.date <= t,
        );
      }
      function futurePendingForMonth(month) {
        const t = todayStr();
        return state.futureExpenses.filter(
          (f) => f.date.slice(0, 7) === month && f.date > t,
        );
      }

      function computeStats(month) {
        const tx = monthTx(month);
        const ingresos = tx
          .filter((t) => t.type === "ingreso")
          .reduce((s, t) => s + t.amount, 0);
        const gastosVarios = tx
          .filter((t) => t.type === "gasto")
          .reduce((s, t) => s + t.amount, 0);
        const gastosFijos = fixedTotalForMonth(month);
        const gastosPareja = privateTotalForMonth(month, "pareja");
        const gastosTarjeta = privateTotalForMonth(month, "tarjeta");
        const gastosPrivados = gastosPareja + gastosTarjeta;
        const gastosFuturos = futureRealizedForMonth(month).reduce(
          (s, f) => s + f.amount,
          0,
        );
        const gastos =
          gastosVarios + gastosFijos + gastosPrivados + gastosFuturos;

        // El dinero que queda después de todos los gastos es el dinero disponible.
        // El porcentaje de ahorro se aplica sobre ese dinero disponible, NO sobre los ingresos.
        // Primero se separa el ahorro y el resto queda como dinero corriente (ocio).
        // Si el disponible baja, bajan ambos importes proporcionalmente.
        // Si el disponible llega a 0 o es negativo, el ahorro se agota y el corriente
        // pasa a negativo: así el gasto empieza a reflejar que ya se está consumiendo
        // dinero que estaba apartado.
        const disponible = ingresos - gastos;
        const ahorroObjetivo = Math.max(0, disponible) * (recoRate / 100);
        const dineroCorriente = disponible - ahorroObjetivo;
        const ahorro = ahorroObjetivo;
        const netoReal = dineroCorriente + ahorro;
        const tasa = ingresos > 0 ? (ahorro / ingresos) * 100 : 0;

        return {
          ingresos,
          gastos,
          gastosVarios,
          gastosFijos,
          gastosPareja,
          gastosTarjeta,
          gastosPrivados,
          gastosFuturos,
          ahorroObjetivo,
          dineroCorriente,
          ahorro,
          netoReal,
          tasa,
          tx,
        };
      }

      function expenseByCategory(month) {
        const tx = monthTx(month).filter((t) => t.type === "gasto");
        const map = {};
        tx.forEach((t) => {
          if (!map[t.category])
            map[t.category] = { val: 0, icon: t.icon || "🧾" };
          map[t.category].val += t.amount;
        });
        state.fixed
          .filter((f) => f.active)
          .forEach((f) => {
            if (!map[f.name]) map[f.name] = { val: 0, icon: f.icon || "🧾" };
            map[f.name].val += Number(f.amount) || 0;
          });
        const pareja = privateTotalForMonth(month, "pareja");
        const tarjeta = privateTotalForMonth(month, "tarjeta");
        if (pareja > 0)
          map["Pareja"] = {
            val: (map["Pareja"] ? map["Pareja"].val : 0) + pareja,
            icon: "❤️",
          };
        if (tarjeta > 0)
          map["Tarjeta de crédito"] = {
            val:
              (map["Tarjeta de crédito"] ? map["Tarjeta de crédito"].val : 0) +
              tarjeta,
            icon: "💳",
          };
        futureRealizedForMonth(month).forEach((f) => {
          if (!map[f.name]) map[f.name] = { val: 0, icon: f.icon || "🧾" };
          map[f.name].val += f.amount;
        });
        return Object.entries(map).sort((a, b) => b[1].val - a[1].val);
      }

      function allMonths() {
        const set = new Set();
        state.transactions.forEach((t) =>
          set.add(t.budgetMonth || t.date.slice(0, 7)),
        );
        Object.keys(state.fixedSnapshots || {}).forEach((m) => set.add(m));
        privateData.pareja.forEach((t) => set.add(t.date.slice(0, 7)));
        privateData.tarjeta.forEach((t) => set.add(t.date.slice(0, 7)));
        state.futureExpenses.forEach((f) => set.add(f.date.slice(0, 7)));
        set.add(currentMonth);
        set.add(realMonth());
        return [...set].sort();
      }

      function totalAccumulatedSavings() {
        return allMonths().reduce((s, m) => s + computeStats(m).ahorro, 0);
      }

      function estimatedIncome(excludeMonth) {
        const nonZero = allMonths()
          .filter((m) => m !== excludeMonth)
          .map((m) => computeStats(m).ingresos)
          .filter((v) => v > 0);
        return nonZero.length
          ? nonZero.reduce((a, b) => a + b, 0) / nonZero.length
          : 0;
      }

      function last6MonthsData() {
        const now = new Date(currentMonth + "-01T00:00:00");
        const months = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          const key = d.toISOString().slice(0, 7);
          const s = computeStats(key);
          months.push({
            key,
            label: MESES[d.getMonth()],
            ingresos: s.ingresos,
            gastos: s.gastos,
          });
        }
        return months;
      }

      function buildDonut(entries) {
        const total = entries.reduce((s, [, v]) => s + v.val, 0);
        if (total <= 0 || entries.length === 0)
          return `<div class="empty-note">Todavía no hay gastos registrados este mes.</div>`;
        const size = 140,
          r = 52,
          cx = size / 2,
          cy = size / 2,
          stroke = 20;
        let offset = 0;
        const circumference = 2 * Math.PI * r;
        let circles = "";
        entries.forEach(([cat, v], i) => {
          const frac = v.val / total;
          const len = frac * circumference;
          const color = CAT_COLORS[i % CAT_COLORS.length];
          circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
          stroke-dasharray="${len} ${circumference - len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
          offset += len;
        });
        const legend = entries
          .map(
            ([cat, v], i) => `
        <li><span class="sw" style="background:${CAT_COLORS[i % CAT_COLORS.length]}"></span>${v.icon} ${cat}<span class="amt">${money(v.val)}</span></li>
      `,
          )
          .join("");
        return `<div class="donut-wrap"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circles}</svg><ul class="legend">${legend}</ul></div>`;
      }

      function buildBars() {
        const data = last6MonthsData();
        const max = Math.max(
          1,
          ...data.map((d) => Math.max(d.ingresos, d.gastos)),
        );
        return (
          `<div class="bars">` +
          data
            .map((d) => {
              const hi = Math.round((d.ingresos / max) * 120);
              const he = Math.round((d.gastos / max) * 120);
              return `<div class="bar-col">
            <div style="display:flex;gap:3px;align-items:flex-end;height:120px;">
              <div style="width:12px;height:${hi}px;background:var(--income);border-radius:2px 2px 0 0;" title="Ingresos ${money(d.ingresos)}"></div>
              <div style="width:12px;height:${he}px;background:var(--expense);border-radius:2px 2px 0 0;" title="Gastos ${money(d.gastos)}"></div>
            </div>
            <div class="m-lbl">${d.label}</div>
          </div>`;
            })
            .join("") +
          `</div>`
        );
      }

      function selectableMonths() {
        const months = new Set(allMonths().filter(isMonthSelectable));
        months.add(realMonth());
        if (nextMonthIsGenerated()) months.add(generatedNextMonth());
        return [...months].sort();
      }
      function monthOptions() {
        const months = selectableMonths().sort().reverse();
        return months
          .map((m) => {
            const [y, mo] = m.split("-");
            return `<option value="${m}" ${m === currentMonth ? "selected" : ""}>${MESES[parseInt(mo, 10) - 1]} ${y}</option>`;
          })
          .join("");
      }
      function monthLabelLargo(m) {
        const [y, mo] = m.split("-");
        return `${MESES_LARGO[parseInt(mo, 10) - 1]} de ${y}`;
      }

      function hormigaData() {
        const rMonth = realMonth();
        if (currentMonth !== rMonth) return { applicable: false };
        const s = computeStats(rMonth);
        const ingresosEstimados =
          s.ingresos > 0 ? s.ingresos : estimatedIncome(rMonth);
        if (ingresosEstimados <= 0) return { applicable: false, noData: true };
        const ahorroObjetivo = ingresosEstimados * (recoRate / 100);
        const pendingFuture = futurePendingForMonth(rMonth).reduce(
          (s, f) => s + f.amount,
          0,
        );
        const comprometido =
          s.gastosFijos +
          s.gastosPrivados +
          s.gastosVarios +
          s.gastosFuturos +
          ahorroObjetivo +
          pendingFuture;
        const leftover = ingresosEstimados - comprometido;
        const today = new Date();
        const daysInMonth = new Date(
          today.getFullYear(),
          today.getMonth() + 1,
          0,
        ).getDate();
        const daysRemaining = Math.max(1, daysInMonth - today.getDate() + 1);
        const daily = leftover / daysRemaining;
        return { applicable: true, daily, leftover, daysRemaining };
      }

        </div>

      }

      function renderResumen(s) {
        const catEntries = expenseByCategory(currentMonth);
        const h = hormigaData();
        let hormigaBlock = "";
        if (!h.applicable) {
          hormigaBlock = `<p class="empty-note">${h.noData ? "Registra un ingreso este mes (o en meses anteriores) para calcular tu margen de gasto hormiga." : "Cambia al mes actual para ver tu margen de gasto hormiga de hoy."}</p>`;
        } else {

          hormigaBlock = `

            ${
              ok
                ? `¡Bien! Hoy puedas usar hasta ${money(h.daily)} en gastos hormiga (un cafecito, un Big Mac de 5€, algún capricho pequeño) sin descuadrar el mes.`

      function renderFijos() {

      async function loadUsers() {
        const box = document.getElementById("users-list");
        if (!box) return;
        try {
          const data = await api("/api/users");
          box.innerHTML = data.users
            .map(
              (u) => `
          <div class="user-row">
            <span class="mv-icon">👤</span>
            <span class="mv-cat"><b>${u.name}</b><span class="note">@${u.username}${u.isAdmin ? " · administrador" : ""}</span></span>
            <div class="user-menu-wrap">
              <button class="user-menu-btn" data-action="toggle-user-menu" data-id="${u.id}" aria-label="Opciones de ${u.name}">⋮</button>

            )

          attachUserMenuEvents();
        } catch (e) {
          box.innerHTML =
            '<p class="empty-note">No tienes permisos para ver usuarios.</p>';

      function attachUserMenuEvents() {
        document
          .querySelectorAll('[data-action="toggle-user-menu"]')
          .forEach((btn) => {
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              const menu = document.getElementById(
                `user-menu-${btn.dataset.id}`,
              );
              document.querySelectorAll(".user-menu.open").forEach((m) => {
                if (m !== menu) m.classList.remove("open");
              });
              menu?.classList.toggle("open");
            });
          });
        document
          .querySelectorAll('[data-action="change-password"]')
          .forEach((btn) => {
            btn.addEventListener("click", async () => {
              document
                .querySelectorAll(".user-menu.open")
                .forEach((m) => m.classList.remove("open"));
              const password = prompt(
                `Nueva contraseña para ${btn.dataset.name}:`,
              );
              if (password === null) return;
              if (password.length < 6) {
                alert("La contraseña debe tener al menos 6 caracteres.");
                return;
              }
              const confirmPassword = prompt("Repite la nueva contraseña:");
              if (confirmPassword !== password) {
                alert("Las contraseñas no coinciden.");
                return;
              }
              try {
                await api(`/api/users/${btn.dataset.id}/password`, {
                  method: "PUT",
                  body: JSON.stringify({ password }),
                });
                alert("Contraseña cambiada correctamente.");
              } catch (e) {
                alert(e.message);
              }
            });
          });
        document.addEventListener("click", closeUserMenus, { once: true });
      }
      function closeUserMenus() {
        document
          .querySelectorAll(".user-menu.open")
          .forEach((m) => m.classList.remove("open"));
      }
      function renderConsejo(s) {
        const ingresosEstimados =
          s.ingresos > 0 ? s.ingresos : estimatedIncome(currentMonth);
        const estimado = s.ingresos <= 0 && ingresosEstimados > 0;

        const fixedTotal = fixedTotalForMonth(currentMonth);

        const prevMonths = allMonths()
          .filter((m) => m < currentMonth)
          .slice(-3);
        const variableHist = prevMonths.map((m) => {
          const st = computeStats(m);
          return st.gastosVarios + st.gastosPrivados + st.gastosFuturos;
        });
        const currentVariable =
          s.gastosVarios + s.gastosPrivados + s.gastosFuturos;
        const avgVariable = variableHist.length
          ? variableHist.reduce((a, b) => a + b, 0) / variableHist.length
          : currentVariable;

        const ahorroObjetivo = ingresosEstimados * (recoRate / 100);
        const disponible = ingresosEstimados - fixedTotal - ahorroObjetivo;
        const ocioSugerido = disponible - avgVariable;

        let content;
        if (ingresosEstimados <= 0) {
          content = `<p class="empty-note">Registra al menos un ingreso (este mes o en meses anteriores) para que la cartilla pueda darte una recomendación.</p>`;
        } else {
          content = `
          <div class="reco-grid">
            <div class="reco-cell"><p class="lbl">Ingresos ${estimado ? "(estimados)" : ""}</p><p class="val">${money(ingresosEstimados)}</p></div>
            <div class="reco-cell"><p class="lbl">Gastos fijos activos</p><p class="val">${money(fixedTotal)}</p></div>
            <div class="reco-cell"><p class="lbl">Ahorro objetivo (${recoRate}%)</p><p class="val">${money(ahorroObjetivo)}</p></div>
            <div class="reco-cell"><p class="lbl">Disponible tras fijos y ahorro</p><p class="val">${money(disponible)}</p></div>
            <div class="reco-cell"><p class="lbl">Gasto variable habitual</p><p class="val">${money(avgVariable)}</p></div>
            <div class="reco-cell"><p class="lbl">Ocio sugerido</p><p class="val">${money(Math.max(0, ocioSugerido))}</p></div>
          </div>
          ${
            disponible < 0
              ? `<div class="reco-note reco-warn">Tus gastos fijos y el ahorro objetivo superan tus ingresos ${estimado ? "estimados" : "de este mes"}. Prueba a bajar el porcentaje de ahorro o revisar tus gastos fijos.</div>`
              : ocioSugerido < 0
                ? `<div class="reco-note reco-warn">Tu gasto variable habitual (Pareja, Tarjeta y futuros incluidos) ya cubre casi todo lo disponible; el margen para ocio este mes es muy ajustado.</div>`
                : `<div class="reco-note">Con este reparto podrías ahorrar ${money(ahorroObjetivo)}, cubrir tus gastos fijos y variables habituales, y aún tener ${money(ocioSugerido)} libres para ocio.</div>`
          }
        `;
        }

        return `
        <section class="panel">
          <h2>Consejo de ahorro</h2>
          <p class="sub">Una recomendación sencilla según tus ingresos, tus gastos fijos activos y tu historial de gastos variables (incluye Pareja, Tarjeta y futuros).</p>
          <div class="range-row">
            <span class="glabel" style="font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--ink-dim);">Objetivo de ahorro</span>
            <input type="range" min="0" max="50" step="5" value="${recoRate}" id="reco-rate">
            <span class="rval">${recoRate}%</span>
          </div>
          ${content}
        </section>
      `;
      }

      function attachEvents() {
        const logoutBtn = document.getElementById("logout-btn");
        if (logoutBtn)
          logoutBtn.addEventListener("click", async () => {
            try {
              await api("/api/logout", { method: "POST" });
            } catch (e) {}
            appUnlocked = false;
            currentUser = null;
            sessionStorage.removeItem("bachaco-month");
            renderGate();
          });

        document.querySelectorAll("nav.tabs button").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeView = btn.dataset.view;
            render();
          });
        });

        const monthSel = document.getElementById("month-select");
        if (monthSel)
          monthSel.addEventListener("change", (e) => {
            const selected = e.target.value;
            if (!isMonthSelectable(selected)) {
              e.target.value = currentMonth;
              return;
            }
            currentMonth = selected;
            sessionStorage.setItem("bachaco-month", currentMonth);
            applyFixedSnapshot(currentMonth);
            render();
          });

        document.querySelectorAll(".type-toggle button").forEach((btn) => {
          btn.addEventListener("click", () => {
            txType = btn.dataset.type;
            render();
          });
        });
        const catInput = document.getElementById("tx-category");
        if (catInput)
          catInput.addEventListener("input", () => {
            const iconSel = document.getElementById("tx-icon");
            if (iconSel && catInput.value.trim())
              iconSel.value = guessIcon(catInput.value);
          });
        const txIconSel = document.getElementById("tx-icon");
        if (txIconSel)
          txIconSel.addEventListener("change", () => {
            txIcon = txIconSel.value;
          });

        const addTxBtn = document.getElementById("add-tx-btn");
        if (addTxBtn)
          addTxBtn.addEventListener("click", async () => {
            const category = document
              .getElementById("tx-category")
              .value.trim();
            const amount = parseFloat(
              document.getElementById("tx-amount").value,
            );
            const date = document.getElementById("tx-date").value;
            const budgetMonth =
              document.getElementById("tx-budget-month").value ||
              date.slice(0, 7);
            const note = document.getElementById("tx-note").value.trim();
            const icon = document.getElementById("tx-icon").value;
            if (!category || !amount || amount <= 0 || !date) return;
            state.transactions.push({
              id: uid(),
              type: txType,
              category,
              amount,
              date,
              budgetMonth,
              note,
              icon,
            });
            await saveTransactions();
            currentMonth = budgetMonth;
            sessionStorage.setItem("bachaco-month", currentMonth);
            applyFixedSnapshot(currentMonth);
            render();
          });
        document.querySelectorAll('[data-action="del-tx"]').forEach((el) => {
          el.addEventListener("click", async () => {
            state.transactions = state.transactions.filter(
              (x) => x.id !== el.dataset.id,
            );
            await saveTransactions();
            render();
          });
        });

        const addFutureBtn = document.getElementById("add-future-btn");
        if (addFutureBtn)
          addFutureBtn.addEventListener("click", async () => {
            const name = document.getElementById("fut-name").value.trim();
            const amount = parseFloat(
              document.getElementById("fut-amount").value,
            );
            const date = document.getElementById("fut-date").value;
            const icon = document.getElementById("fut-icon").value;
            const addNow = !!document.getElementById("fut-add-now")?.checked;
            if (!name || !amount || amount <= 0 || !date) return;

            if (addNow) {
              // Se registra inmediatamente como movimiento, pero conserva la fecha propuesta.
              // Así aparece en el mes financiero de esa fecha y no se duplica cuando llegue el día.
              const budgetMonth = date.slice(0, 7);
              state.transactions.push({
                id: uid(),
                type: "gasto",
                category: name,
                amount,
                date,
                budgetMonth,
                note: "Añadido desde Gastos futuros",
                icon,
              });
              currentMonth = budgetMonth;
              sessionStorage.setItem("bachaco-month", currentMonth);
              applyFixedSnapshot(currentMonth);
              await saveTransactions();
              render();
              return;
            }

            state.futureExpenses.push({ id: uid(), name, amount, date, icon });
            await saveFuture();
            render();
          });
        document
          .querySelectorAll('[data-action="del-future"]')
          .forEach((el) => {
            el.addEventListener("click", async () => {
              state.futureExpenses = state.futureExpenses.filter(
                (x) => x.id !== el.dataset.id,
              );
              await saveFuture();
              render();
            });
          });

        const addFixedBtn = document.getElementById("add-fixed-btn");
        if (addFixedBtn)
          addFixedBtn.addEventListener("click", async () => {
            const name = document.getElementById("new-fixed-name").value.trim();
            const amount =
              parseFloat(document.getElementById("new-fixed-amount").value) ||
              0;
            const icon = document.getElementById("new-fixed-icon").value;
            if (!name) return;
            state.fixed.push({ id: uid(), name, amount, active: true, icon });
            await saveFixed();
            render();
          });
        document
          .querySelectorAll('[data-action="toggle-fixed"]')
          .forEach((el) => {
            el.addEventListener("click", async () => {
              const f = state.fixed.find((x) => x.id === el.dataset.id);
              if (f) {
                f.active = !f.active;
                await saveFixed();
                render();
              }
            });
          });
        document
          .querySelectorAll('[data-action="edit-fixed"]')
          .forEach((el) => {
            el.addEventListener("change", async () => {
              const f = state.fixed.find((x) => x.id === el.dataset.id);
              if (f) {
                f.amount = parseFloat(el.value) || 0;
                await saveFixed();
                render();
              }
            });
          });
        document
          .querySelectorAll('[data-action="edit-fixed-icon"]')
          .forEach((el) => {
            el.addEventListener("change", async () => {
              const f = state.fixed.find((x) => x.id === el.dataset.id);
              if (f) {
                f.icon = el.value;
                await saveFixed();
                render();
              }
            });
          });
        document.querySelectorAll('[data-action="del-fixed"]').forEach((el) => {
          el.addEventListener("click", async () => {
            state.fixed = state.fixed.filter((x) => x.id !== el.dataset.id);
            await saveFixed();
            render();
          });
        });

        const addGoalBtn = document.getElementById("add-goal-btn");
        if (addGoalBtn)
          addGoalBtn.addEventListener("click", async () => {
            const name = document.getElementById("new-goal-name").value.trim();
            const target =
              parseFloat(document.getElementById("new-goal-target").value) || 0;
            const icon = document.getElementById("new-goal-icon").value;
            if (!name) return;
            state.goals.push({ id: uid(), name, icon, target, pct: 0 });
            await saveGoals();
            render();
          });
        document.querySelectorAll('[data-action="del-goal"]').forEach((el) => {
          el.addEventListener("click", async () => {
            state.goals = state.goals.filter((x) => x.id !== el.dataset.id);
            await saveGoals();
            render();
          });
        });
        document
          .querySelectorAll('[data-action="edit-goal-target"]')
          .forEach((el) => {
            el.addEventListener("change", async () => {
              const g = state.goals.find((x) => x.id === el.dataset.id);
              if (g) {
                g.target = parseFloat(el.value) || 0;
                await saveGoals();
                render();
              }
            });
          });
        document
          .querySelectorAll('[data-action="edit-goal-pct"]')
          .forEach((el) => {
            el.addEventListener("input", async () => {
              const g = state.goals.find((x) => x.id === el.dataset.id);
              if (g) {
                g.pct = parseInt(el.value, 10) || 0;
                await saveGoals();
                render();
              }
            });
          });

        const parejaAddBtn = document.getElementById("pareja-add-btn");
        if (parejaAddBtn)
          parejaAddBtn.addEventListener("click", () => {
            const modal = document.getElementById("pareja-modal");
            if (modal) modal.hidden = false;
          });
        const saveParejaBtn = document.getElementById("save-pareja-modal");
        if (saveParejaBtn)
          saveParejaBtn.addEventListener("click", async () => {
            const amount = parseFloat(
              document.getElementById("pareja-modal-amount").value,
            );
            const date = document.getElementById("pareja-modal-date").value;
            const note = document
              .getElementById("pareja-modal-note")
              .value.trim();
            if (!amount || amount <= 0 || !date)
              return alert("Indica un importe y una fecha válidos.");
            normalizePrivateData();
            privateData.pareja.push({
              id: uid(),
              amount,
              date,
              note,
              type: "gasto",
            });
            await savePrivate();
            currentMonth = date.slice(0, 7);
            sessionStorage.setItem("bachaco-month", currentMonth);
            applyFixedSnapshot(currentMonth);
            document.getElementById("pareja-modal").hidden = true;
            render();
          });
        document
          .querySelectorAll('[data-action="open-card-movement"]')
          .forEach((btn) => {
            btn.addEventListener("click", () => {
              const type = btn.dataset.cardType;
              document.getElementById("card-movement-modal-type").value = type;
              document.getElementById("card-movement-modal-title").textContent =
                type === "pago"
                  ? "💶 Registrar pago a tarjeta"
                  : "➕ Registrar cargo";
              document.getElementById("card-movement-modal-help").textContent =
                type === "pago"
                  ? "El pago reduce la deuda y SÍ se registra como gasto porque sale dinero de tu cuenta."
                  : "El cargo aumenta la deuda de la tarjeta. No se registra como salida de efectivo todavía.";
              document.getElementById("card-movement-modal-note").placeholder =
                type === "pago"
                  ? "Ej. Pago de la tarjeta"
                  : "Ej. Compra supermercado";
              document.getElementById("card-movement-modal").hidden = false;
            });
          });
        const saveCardMovementBtn = document.getElementById(
          "save-card-movement-modal",
        );
        if (saveCardMovementBtn)
          saveCardMovementBtn.addEventListener("click", async () => {
            normalizePrivateData();
            const type = document.getElementById(
              "card-movement-modal-type",
            ).value;
            const amount = parseFloat(
              document.getElementById("card-movement-modal-amount").value,
            );
            const date = document.getElementById(
              "card-movement-modal-date",
            ).value;
            const note = document
              .getElementById("card-movement-modal-note")
              .value.trim();
            if (!amount || amount <= 0 || !date)
              return alert("Indica un importe y una fecha válidos.");
            if (type === "pago" && amount > tarjetaBalance())
              return alert(
                `El pago (${money(amount)}) supera la deuda actual (${money(tarjetaBalance())}).`,
              );
            privateData.tarjeta.push({ id: uid(), amount, date, note, type });
            await savePrivate();
            currentMonth = date.slice(0, 7);
            sessionStorage.setItem("bachaco-month", currentMonth);
            applyFixedSnapshot(currentMonth);
            document.getElementById("card-movement-modal").hidden = true;
            render();
          });

        const openLimitModal = () => {
          const modal = document.getElementById("limit-modal");
          if (modal) modal.hidden = false;
        };
        document
          .querySelectorAll('#card-limit-btn,[data-action="open-limit-modal"]')
          .forEach((el) => el.addEventListener("click", openLimitModal));

        const saveCardLimitBtn = document.getElementById("save-card-limit");
        if (saveCardLimitBtn)
          saveCardLimitBtn.addEventListener("click", async () => {
            const input = document.getElementById("card-limit-input");
            const limit = parseFloat(input.value);
            if (!Number.isFinite(limit) || limit < 0)
              return alert("Indica un límite válido igual o mayor que 0.");
            normalizePrivateData();
            privateData.tarjetaMeta.limit = limit;
            await savePrivate();
            document.getElementById("limit-modal").hidden = true;
            render();
          });

        document.querySelectorAll('[data-action="priv-del"]').forEach((el) => {
          el.addEventListener("click", async () => {
            const key = el.dataset.key;
            normalizePrivateData();
            privateData[key] = privateData[key].filter(
              (x) => x.id !== el.dataset.id,
            );
            await savePrivate();
            render();
          });
        });

        const createUserBtn = document.getElementById("create-user-btn");
        if (createUserBtn)
          createUserBtn.addEventListener("click", async () => {
            const username = document
              .getElementById("new-user-username")
              .value.trim();
            const name = document.getElementById("new-user-name").value.trim();
            const password = document.getElementById("new-user-password").value;
            if (!username || !name || !password)
              return alert("Completa usuario, nombre y contraseña.");
            try {
              await api("/api/users", {
                method: "POST",
                body: JSON.stringify({ username, name, password }),
              });
              document.getElementById("new-user-username").value = "";
              document.getElementById("new-user-name").value = "";
              document.getElementById("new-user-password").value = "";
              await loadUsers();
            } catch (e) {
              alert(e.message);
            }
          });
        if (activeView === "usuarios") loadUsers();

        document
          .querySelectorAll(
            '[data-action="close-pareja-modal"],[data-action="close-card-modal"],[data-action="close-card-movement-modal"],[data-action="close-limit-modal"]',
          )
          .forEach((btn) => {
            btn.addEventListener("click", () => {
              const map = {
                "close-pareja-modal": "pareja-modal",
                "close-card-modal": "card-modal",
                "close-card-movement-modal": "card-movement-modal",
                "close-limit-modal": "limit-modal",
              };
              const modal = document.getElementById(map[btn.dataset.action]);
              if (modal) modal.hidden = true;
            });
          });

        const rateSlider = document.getElementById("reco-rate");
        if (rateSlider)
          rateSlider.addEventListener("input", () => {
            recoRate = parseInt(rateSlider.value, 10);
            render();
          });
      }

      (async function boot() {
        try {
          const me = await api("/api/me");
          if (me.user) {
            appUnlocked = true;
            await loadState();
          } else renderGate();
        } catch (e) {
          renderGate();
        }
      })();
    </script>
  </body>
</html>
